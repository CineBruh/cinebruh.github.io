name: Sincronizar catálogo (Drive → data.json)

on:
  schedule:
    - cron: '17 * * * *'    # a cada hora, aos :17 (minuto "quebrado" para rodar menos atrasado)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write             # necessário para a Action commitar o data.json

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler o Drive e gerar data.json
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/sync-drive.mjs

      - name: Commitar se o catálogo mudou
        run: |
          if [ -n "$(git status --porcelain data.json covers-cache.json)" ]; then
            git config user.name  "cinebruh-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json covers-cache.json
            git commit -m "🤖 Atualiza catálogo a partir do Drive"
            git push
            echo "Catálogo atualizado."
          else
            echo "Nada mudou no data.json."
          fi
