name: Sincronizar catálogo (Trello + Drive → data.json)

on:
  schedule:
    - cron: '17 * * * *'    # a cada hora, aos :17 (minuto "quebrado" para rodar menos atrasado)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write             # necessário para a Action commitar o data.json e o cronograma.json

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Guardar o catálogo e os avisos anteriores (para comparar depois)
        run: |
          cp data.json /tmp/data-old.json || true
          cp sync-avisos.json /tmp/avisos-old.json || true

      - name: Ler o Trello e o Drive e gerar data.json e cronograma.json
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/sync-drive.mjs

      - name: Commitar se o catálogo mudou
        id: commit
        run: |
          ARQS="data.json covers-cache.json cronograma.json sync-avisos.json"
          if [ -n "$(git status --porcelain $ARQS)" ]; then
            git config user.name  "cinebruh-bot"
            git config user.email "actions@users.noreply.github.com"
            git add $ARQS
            git commit -m "🤖 Atualiza catálogo a partir do Trello e do Drive"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Catálogo atualizado."
          else
            echo "Nada mudou no data.json, no cronograma.json nem nos avisos."
          fi

      - name: Avisar no Discord o que mudou
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true   # se o Discord falhar, o site continua atualizado
        env:
          DISCORD_WEBHOOK_NOVIDADES: ${{ secrets.DISCORD_WEBHOOK_NOVIDADES }}
          DISCORD_WEBHOOK_ALERTAS: ${{ secrets.DISCORD_WEBHOOK_ALERTAS }}
        run: node scripts/notify-discord.mjs /tmp/data-old.json data.json /tmp/avisos-old.json sync-avisos.json

      - name: Avisar no Discord se a sincronização falhou
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTAS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -H "Content-Type: application/json" -d "{\"username\":\"Cinebruh\",\"embeds\":[{\"title\":\"❌ A sincronização do catálogo falhou\",\"description\":\"O site não foi atualizado nesta rodada (Trello, Drive ou TMDB fora do ar, ou erro no robô). [Ver o log]($RUN_URL)\",\"color\":15158332}]}" "$WEBHOOK"
